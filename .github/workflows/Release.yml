name: Release

# 触发器
on:
  push:
    tags:
      - v*
  pull_request:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      root_sol:
        description: "Release Title"
        required: true
        default: "SmsForwarder"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 检出代码
      - uses: actions/checkout@v4
      # 设置jdk环境为11
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk
      # 获取打包秘钥
      - name: Checkout Android Keystore
        uses: actions/checkout@v4
        with:
          repository: lieqijun/keystore
          token: ${{ secrets.TOKEN }} # 连接仓库的token,需要单独配置
          path: keystore # 仓库的根目录名
      # 修正 keystore 内 alias 为 lieqijun（CI 自带 JDK 提供 keytool，无需本机操作）
      - name: Fix keystore alias to lieqijun
        run: |
          command -v keytool >/dev/null 2>&1 || export PATH="$JAVA_HOME/bin:$PATH"
          PROPS=keystore/keystore.properties
          STORE_PASSWORD=$(grep -iE '^storePassword[[:space:]]*=' "$PROPS" | head -1 | cut -d'=' -f2- | tr -d ' \r')
          KEY_PASSWORD=$(grep -iE '^keyPassword[[:space:]]*=' "$PROPS" | head -1 | cut -d'=' -f2- | tr -d ' \r')
          ORIG_STORE_FILE=$(grep -iE '^storeFile[[:space:]]*=' "$PROPS" | head -1 | cut -d'=' -f2- | tr -d ' \r')
          # keystore 始终 checkout 到仓库根的 keystore/ 目录，直接在此定位 jks（不依赖 properties 里的相对路径）
          KEYSTORE=$(ls keystore/*.jks 2>/dev/null | head -1)
          echo "Keystore: $KEYSTORE"
          echo "Current keystore entries:"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>&1 | grep -i "PrivateKeyEntry" || true
          OLD_ALIAS=$(keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | grep -i "PrivateKeyEntry" | head -1 | cut -d',' -f1 | tr -d ' ')
          NEW_ALIAS=lieqijun
          echo "Detected alias: '$OLD_ALIAS'"
          if [ -n "$OLD_ALIAS" ] && [ "$OLD_ALIAS" != "$NEW_ALIAS" ]; then
            keytool -changealias -keystore "$KEYSTORE" -alias "$OLD_ALIAS" -destalias "$NEW_ALIAS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" && echo "Alias changed -> $NEW_ALIAS"
          else
            echo "Alias already $NEW_ALIAS or not detected, skip"
          fi
          # 保持原 storeFile 的目录前缀，仅把文件名更新为实际 jks（兼容 root/app 两种解析方式）
          STORE_FILE_REWRITE=$(dirname "$ORIG_STORE_FILE")/$(basename "$KEYSTORE")
          {
            echo "keyAlias=$NEW_ALIAS"
            echo "storeFile=$STORE_FILE_REWRITE"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$PROPS"
          echo "Rewrote $PROPS with keyAlias=$NEW_ALIAS, storeFile=$STORE_FILE_REWRITE"
      # 打包release
      - name: Build with Gradle
        run: bash ./gradlew assembleRelease
      # 创建 Release 并上传 APK
      # 用 softprops/action-gh-release 替代已废弃的 actions/create-release
      # （create-release 会触发 url.parse 弃用告警，且对 token 权限较敏感）
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmsForwarder ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ./app/build/outputs/apk/release/SmsF_*
